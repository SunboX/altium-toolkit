name: Publish Package

on:
    push:
        tags:
            - 'v*'

permissions:
    contents: read
    id-token: write

jobs:
    publish:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  registry-url: https://registry.npmjs.org
                  package-manager-cache: false

            - name: Install dependencies
              run: npm ci

            - name: Check release tag
              run: |
                  node -e "const pkg = require('./package.json'); const expected = 'v' + pkg.version; const actual = process.env.GITHUB_REF_NAME; if (actual !== expected) { console.error('Tag ' + actual + ' does not match package version ' + expected); process.exit(1); }"

            - name: Check formatting
              run: npm run check:format

            - name: Run tests
              run: npm test

            - name: Publish to npm
              run: npm publish
